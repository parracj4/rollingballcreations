<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a962"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ffd2bd"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0a0f"/>
  <!-- curving ramp: drops from upper left, sweeps along the bottom, kicks up on the right -->
  <path d="M7 30 C 21 32, 24 52, 38 52 S 54 45, 57 36" fill="none" stroke="url(#track)" stroke-width="5.5" stroke-linecap="round"/>
  <!-- ball resting on the ramp, partway down -->
  <circle cx="17.5" cy="20.5" r="9.5" fill="url(#ball)"/>
</svg>
